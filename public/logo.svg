<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Linear Gradient for Text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0a192f"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>

  <!-- Sleek Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.2"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.05"/>

  <!-- Logo Group -->
  <g transform="translate(256, 300)" text-anchor="middle">
    <!-- Glow behind the dot -->
    <circle cx="-15" cy="-15" r="22" fill="#06b6d4" opacity="0.3" filter="url(#neon)"/>
    
    <!-- Text "r.06" -->
    <text font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="145" 
          letter-spacing="-3"
          fill="url(#textGrad)">
      r<tspan fill="#06b6d4" filter="url(#neon)">.</tspan>06
    </text>
  </g>

  <!-- Corner Accent Markers (Tech look) -->
  <path d="M 56 88 L 88 88 L 88 56" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M 456 88 L 424 88 L 424 56" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M 56 424 L 88 424 L 88 456" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M 456 424 L 424 424 L 424 456" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>
